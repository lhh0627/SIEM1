<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Watchtower SIEM (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--p:#fff;--t:#14202b;--m:#5f7080;--b:#d5dde3;--hv:#e8eef1;--a:#0b8a8f;--r:#d32f2f;--o:#e0701a;--y:#a87a10;--bl:#2d6cdf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1218;--p:#111c25;--t:#e3ecf1;--m:#8398a8;--b:#22313d;--hv:#192833;--a:#2cc4c9;--bl:#6b9bff;--y:#d9a52b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1218;--p:#111c25;--t:#e3ecf1;--m:#8398a8;--b:#22313d;--hv:#192833;--a:#2cc4c9;--bl:#6b9bff;--y:#d9a52b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--t)}
#app{display:flex;height:100%}
nav{width:210px;background:var(--p);border-right:1px solid var(--b);padding:12px 8px;overflow:auto;flex:none}
nav h1{font-size:16px;font-weight:600;margin:4px 8px 14px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--t);padding:8px 10px;cursor:pointer;font:inherit}
nav button:hover{background:var(--hv)}nav button.on{background:var(--hv);border-left-color:var(--a);font-weight:600}
main{flex:1;min-width:0;overflow:auto;padding:16px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.top h2{margin:0;flex:1;font-size:20px;font-weight:600;min-width:140px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.btn{background:var(--a);color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
:root[data-theme="dark"] .btn:not(.s):not(.d){color:#06191c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.s):not(.d){color:#06191c}}
.btn.s{background:var(--p);color:var(--t);border:1px solid var(--b)}.btn.d{background:var(--r);color:#fff}.btn.on{outline:2px solid var(--a)}
.card{background:var(--p);border:1px solid var(--b);border-radius:4px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.grid .card{margin:0}
.k{font-size:26px;font-weight:600}.m{color:var(--m);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--b);font-size:13px;vertical-align:top}th{color:var(--m);font-weight:500}
tr.c{cursor:pointer}tr.c:hover{background:var(--hv)}.w{overflow-x:auto}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
input,select,textarea{background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:4px;padding:6px 8px;font:inherit;max-width:100%}
.tag{padding:1px 8px;border-radius:10px;font-size:11px;color:#fff;display:inline-block}
.critical{background:var(--r)}.high{background:var(--o)}.medium{background:var(--y)}.low{background:var(--bl)}.info{background:var(--m)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:8px;background:var(--a);border-radius:2px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal>div{background:var(--p);border:1px solid var(--b);border-radius:6px;padding:16px;max-width:760px;width:100%;max-height:90%;overflow:auto}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;background:var(--t);color:var(--bg);padding:8px 14px;border-radius:4px;display:none;z-index:30;max-width:80%}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--b);padding:6px}nav h1{display:none}nav button{white-space:nowrap;width:auto;gap:6px}.two{grid-template-columns:1fr}}
</style></head><body>
<div id="app"><nav></nav><main></main></div><div id="modal" onclick="if(event.target===this)mc()"><div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=a=>a[Math.floor(Math.random()*a.length)],rn=n=>Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const SEV=['critical','high','medium','low','info'],tag=s=>`<span class="tag ${s}">${s}</span>`;
const HOSTS=['dc01','web-prod-02','db-fin-01','vpn-gw','laptop-hr-14','k8s-node-3'],USERS=['alice','bob','svc-backup','admin','carol','dave'];
const EVT=[['Windows Security','4625 Failed logon','low'],['Windows Security','4624 Logon','info'],['Windows Security','4720 User created','medium'],['Linux Auth','sshd failed password','low'],['Linux Auth','sudo command','info'],['Firewall','Deny inbound','low'],['Firewall','Allow outbound','info'],['Firewall','Port scan detected','medium'],['AWS CloudTrail','ConsoleLogin','info'],['AWS CloudTrail','DeleteTrail','high'],['Office 365','MailForwardRule created','medium'],['Office 365','Sign-in','info'],['EDR','PowerShell encoded command','high'],['EDR','Mimikatz signature','critical'],['EDR','Process injection','high']];
let S={v:'ov',live:true,auto:false,user:'analyst1',q:'sev=high',tr:24,f:'All',si:null},N=0,ev=[],inc=[],audit=[],plog=[];
let saved=['sev=critical','event~failed | count by host','source="AWS CloudTrail" | top event'];
let iocs=[{v:'185.220.101.7',t:'IP',s:'AbuseIPDB'},{v:'mimikatz',t:'Keyword',s:'Internal'},{v:'91.240.118.22',t:'IP',s:'AlienVault OTX'}];
let conns=[{n:'Windows Security',on:1,eps:42},{n:'Linux Auth',on:1,eps:18},{n:'Firewall',on:1,eps:130},{n:'AWS CloudTrail',on:1,eps:9},{n:'Office 365',on:0,eps:27},{n:'EDR',on:1,eps:25}];
let rules=[{id:1,name:'Brute force: repeated failed logons',q:'event~fail',thr:5,sev:'high',mitre:'T1110',on:1},{id:2,name:'Credential dumping tool detected',q:'event~mimikatz',thr:1,sev:'critical',mitre:'T1003',on:1},{id:3,name:'CloudTrail logging disabled',q:'event~DeleteTrail',thr:1,sev:'high',mitre:'T1562',on:1},{id:4,name:'Encoded PowerShell execution',q:'event~powershell',thr:1,sev:'high',mitre:'T1059',on:1},{id:5,name:'Mailbox forwarding rule created',q:'event~MailForward',thr:1,sev:'medium',mitre:'T1114',on:1},{id:6,name:'Port scan from external IP',q:'event~scan',thr:2,sev:'medium',mitre:'T1046',on:0}];
let users=[{n:'analyst1',r:'Analyst',mfa:1},{n:'soc.lead',r:'Admin',mfa:1},{n:'auditor',r:'Viewer',mfa:0}];
const pbs=[{n:'Block IP at firewall',st:['Extract source IP','Push deny rule to firewall','Verify rule is active']},{n:'Isolate host via EDR',st:['Locate agent','Network-quarantine host','Confirm isolation']},{n:'Disable user account',st:['Resolve user in directory','Disable account','Revoke active sessions']},{n:'Notify on-call analyst',st:['Page on-call via Slack','Send email summary']}];
function parseQ(q){const[f,...p]=q.split('|');const t=f.match(/(?:[^\s"]+|"[^"]*")+/g)||[];return{c:t.map(x=>{const m=x.match(/^(\w+)(!=|=|~)(.+)$/);return m?{k:m[1]==='sev'?'sev':m[1],op:m[2],v:m[3].replace(/"/g,'').toLowerCase()}:{k:'*',op:'~',v:x.replace(/"/g,'').toLowerCase()}}),p:p.map(s=>s.trim())}}
function match(e,c){return c.every(x=>{const h=x.k==='*'?Object.values(e).join(' ').toLowerCase():String(e[x.k]??'').toLowerCase();return x.op==='='?h===x.v:x.op==='!='?h!==x.v:h.includes(x.v)})}
function mk(t){const L=EVT.filter(e=>conns.find(c=>c.n===e[0]).on);if(!L.length)return null;let x=R(L);if(x[2]!=='info'&&Math.random()<.6)x=R(L);const ip=Math.random()<.04?'185.220.101.7':R(['185','91','45','103','10','192'])+'.'+rn(255)+'.'+rn(255)+'.'+rn(255),h=R(HOSTS),u=R(USERS);return mk2(t,x[0],x[1],x[2],h,u,ip)}
function mk2(t,source,event,sev,host,user,ip){return{id:'e'+(++N),t,source,event,sev,host,user,ip,msg:`${event} on ${host} by ${user} from ${ip}`}}
function log(m){audit.unshift({t:Date.now(),u:S.user,m})}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)}
function modal(h){$('#modal>div').innerHTML=h;$('#modal').style.display='flex'}function mc(){$('#modal').style.display='none'}
function addInc(title,sev,host,rule,n){const i={id:'INC-'+(1000+inc.length+1),title,sev,status:'New',owner:'Unassigned',host,rule,t:Date.now(),notes:[{t:Date.now(),a:'system',x:'Incident opened by '+rule}],evs:n||1};inc.unshift(i);log('Incident '+i.id+' created');toast('New incident '+i.id+': '+title);if(S.auto&&sev==='critical')runPb(i.id,1,1);return i}
function evalRules(e){rules.filter(r=>r.on).forEach(r=>{const c=parseQ(r.q).c;if(!match(e,c))return;const n=ev.slice(0,300).filter(x=>x.host===e.host&&match(x,c)).length;if(n>=r.thr&&!inc.some(i=>i.rule===r.name&&i.host===e.host&&i.status!=='Closed'))addInc(r.name+' on '+e.host,r.sev,e.host,r.name,n)})}
function push(e){ev.unshift(e);evalRules(e);if(ev.length>3000)ev.length=3000}
function tick(){if(!S.live)return;for(let i=0,n=1+rn(3);i<n;i++){const e=mk(Date.now());if(e)push(e)}if(S.v==='ov')rMain();rNav()}
function simulate(){const h=R(HOSTS),ip='185.220.101.7',t=Date.now();for(let i=0;i<7;i++)push(mk2(t+i,'Windows Security','4625 Failed logon','low',h,'admin',ip));push(mk2(t+8,'Windows Security','4624 Logon','info',h,'admin',ip));push(mk2(t+9,'EDR','PowerShell encoded command','high',h,'admin',ip));push(mk2(t+10,'EDR','Mimikatz signature','critical',h,'admin',ip));log('Attack simulation run on '+h);toast('Simulated intrusion on '+h);render()}
function go(v){S.v=v;render()}
const NAV=[['ov','Overview'],['se','Log search'],['inc','Incidents'],['ru','Detection rules'],['ti','Threat intel'],['co','Data connectors'],['pb','Playbooks'],['ad','Admin and audit']];
function rNav(){$('nav').innerHTML='<h1>Watchtower SIEM</h1>'+NAV.map(([k,l])=>`<button class="${S.v===k?'on':''}" onclick="go('${k}')">${l}${k==='inc'?`<span class="tag critical">${inc.filter(i=>i.status!=='Closed').length}</span>`:''}</button>`).join('')}
function rMain(){const y=document.querySelector('main').scrollTop;$('main').innerHTML=`<div class="top"><h2>${NAV.find(n=>n[0]===S.v)[1]}</h2><button class="btn s ${S.live?'on':''}" onclick="S.live=!S.live;toast('Live ingestion '+(S.live?'on':'paused'));render()">${S.live?'Live: on':'Live: paused'}</button><button class="btn d" onclick="simulate()">Simulate attack</button><button class="btn s" onclick="th()">Theme</button></div>`+V[S.v]();document.querySelector('main').scrollTop=y}
function render(){rNav();rMain();if(S.v==='se')runQ()}
function th(){const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'}
function table(h,rows,fn,ids){return`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr ${fn?`class="c" onclick="${fn}('${ids[i]}')"`:''}>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="m">Nothing to show.</td></tr>`}</table></div>`}
function sel(o,v,f){return`<select onchange="${f}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`}
const CC={'Credential access':'#d32f2f','Execution':'#e0701a','Defense evasion':'#a87a10','Persistence':'#7b5ea7','Discovery':'#2d6cdf','Initial access':'#0b8a8f'};
function catOf(e){const s=e.event;return /fail|mimikatz/i.test(s)?'Credential access':/powershell/i.test(s)?'Execution':/DeleteTrail|injection/i.test(s)?'Defense evasion':/created|Forward/i.test(s)?'Persistence':/scan/i.test(s)?'Discovery':/Deny inbound/i.test(s)?'Initial access':null}
function donut(ct){const E=Object.entries(ct).sort((a,b)=>b[1]-a[1]),T=E.reduce((a,x)=>a+x[1],0),C=2*Math.PI*40;let o=0;if(!T)return'<div class="m">No attack events yet.</div>';return`<div class="row"><svg viewBox="0 0 110 110" width="150" role="img" aria-label="Attack categories"><g transform="rotate(-90 55 55)" fill="none" stroke-width="16">${E.map(([k,v])=>{const l=v/T*C,s=`<circle cx="55" cy="55" r="40" stroke="${CC[k]}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"><title>${k}: ${v}</title></circle>`;o+=l;return s}).join('')}</g><text x="55" y="53" text-anchor="middle" fill="var(--t)" font-size="16" font-weight="600">${T}</text><text x="55" y="66" text-anchor="middle" fill="var(--m)" font-size="8">attack events</text></svg><div style="flex:1;min-width:130px">${E.map(([k,v])=>`<div class="row" style="margin:3px 0"><span style="width:10px;height:10px;background:${CC[k]};display:inline-block"></span>${k}<span class="m" style="margin-left:auto">${v}</span></div>`).join('')}</div></div>`}
const V={ov(){const now=Date.now(),b=Array(24).fill(0),sv={},ct={};ev.forEach(e=>{const c=catOf(e);if(c)ct[c]=(ct[c]||0)+1;const k=Math.floor((now-e.t)/36e5);if(k>=0&&k<24)b[23-k]++;sv[e.sev]=(sv[e.sev]||0)+1});const mx=Math.max(...b,1),op=inc.filter(i=>i.status!=='Closed');
return`<div class="grid"><div class="card"><div class="k">${ev.length}</div><div class="m">Events stored</div></div><div class="card"><div class="k">${op.length}</div><div class="m">Open incidents</div></div><div class="card"><div class="k">${op.filter(i=>i.sev==='critical').length}</div><div class="m">Critical open</div></div><div class="card"><div class="k">${rules.filter(r=>r.on).length}/${rules.length}</div><div class="m">Rules enabled</div></div><div class="card"><div class="k">${conns.filter(c=>c.on).reduce((a,c)=>a+c.eps,0)}</div><div class="m">Events per second</div></div></div>
<div class="two"><div class="card"><b>Events per hour, last 24h</b><svg viewBox="0 0 480 110" width="100%" role="img" aria-label="Events per hour">${b.map((v,i)=>`<rect x="${i*20+2}" y="${100-v/mx*95}" width="16" height="${v/mx*95}" fill="var(--a)"><title>${v} events</title></rect>`).join('')}</svg></div>
<div class="card"><b>Attack categories</b>${donut(ct)}</div></div>
<div class="grid">${SEV.map(s=>`<div class="card">${tag(s)}<div class="k">${sv[s]||0}</div><div class="m">${ev.length?Math.round((sv[s]||0)/ev.length*100):0}% of events</div></div>`).join('')}</div>
<div class="card"><b>Recent incidents</b>${table(['ID','Title','Sev','Status'],inc.slice(0,6).map(i=>[i.id,esc(i.title),tag(i.sev),i.status]),'openInc',inc.slice(0,6).map(i=>i.id))}</div>`},
se(){return`<div class="card"><div class="row"><input id="q" style="flex:1;min-width:220px" class="mono" value="${esc(S.q)}" placeholder="sev=high host=dc01 | count by user" onkeydown="if(event.key==='Enter')runQ()"><select id="tr" onchange="runQ()">${[[1,'Last hour'],[24,'Last 24 hours'],[0,'All time']].map(([v,l])=>`<option value="${v}" ${S.tr===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn" onclick="runQ()">Run query</button><button class="btn s" onclick="saveQ()">Save query</button><button class="btn s" onclick="expQ()">Export CSV</button></div><div class="m">Use field=value, field!=value, field~text, or plain text. Add | count by field or | top field. Fields: source, event, sev, host, user, ip, msg.</div><div>${saved.map((s,i)=>`<span class="tag info mono" style="cursor:pointer;margin:4px 4px 0 0" onclick="S.q=saved[${i}];render()">${esc(s)}</span>`).join('')}</div></div><div class="card" id="res"></div>`},
inc(){const l=inc.filter(i=>S.f==='All'||i.status===S.f);return`<div class="card"><div class="row">Status ${sel(['All','New','Investigating','Resolved','Closed'],S.f,"S.f=this.value;render()")}<span class="m">${l.length} incidents</span></div>${table(['ID','Title','Sev','Status','Owner','Opened'],l.map(i=>[i.id,esc(i.title),tag(i.sev),i.status,esc(i.owner),fmt(i.t)]),'openInc',l.map(i=>i.id))}</div>`+det()},
ru(){return`<div class="card"><b>New detection rule</b><div class="row"><input id="rn" placeholder="Rule name"><input id="rq" class="mono" placeholder="event~failed host=dc01"><select id="rs">${SEV.map(s=>`<option>${s}</option>`).join('')}</select><input id="rt" type="number" min="1" value="1" style="width:70px" title="Threshold"><input id="rm" placeholder="MITRE ID" style="width:90px"><button class="btn" onclick="addRule()">Add rule</button></div></div><div class="card">${table(['On','Name','Query','Sev','Min hits','MITRE','Matches','Actions'],rules.map(r=>[`<input type="checkbox" ${r.on?'checked':''} onchange="tog(${r.id})">`,esc(r.name),`<span class="mono">${esc(r.q)}</span>`,tag(r.sev),r.thr,esc(r.mitre),ev.filter(e=>match(e,parseQ(r.q).c)).length,`<button class="btn s" onclick="runRule(${r.id})">Run now</button> <button class="btn d" onclick="delRule(${r.id})">Delete</button>`]))}</div>`},
ti(){return`<div class="card"><div class="row"><input id="iv" placeholder="IP, domain, hash or keyword"><select id="it"><option>IP</option><option>Domain</option><option>Hash</option><option>Keyword</option></select><input id="is" placeholder="Source" value="Manual"><button class="btn" onclick="addIoc()">Add indicator</button><button class="btn s" onclick="scanIoc()">Scan stored events</button></div></div><div class="card">${table(['Indicator','Type','Source','Hits','Actions'],iocs.map((o,i)=>[`<span class="mono">${esc(o.v)}</span>`,o.t,esc(o.s),ev.filter(e=>Object.values(e).join(' ').toLowerCase().includes(o.v.toLowerCase())).length,`<button class="btn d" onclick="iocs.splice(${i},1);log('IOC removed');render()">Remove</button>`]))}</div>`},
co(){return`<div class="grid">${conns.map((c,i)=>`<div class="card"><b>${c.n}</b><div class="m">${c.on?'Connected, '+c.eps+' events/sec':'Not connected'}</div><div class="row"><button class="btn ${c.on?'d':''}" onclick="conns[${i}].on^=1;log('Connector ${c.n} '+(conns[${i}].on?'connected':'disconnected'));render()">${c.on?'Disconnect':'Connect'}</button><button class="btn s" onclick="toast('${c.n}: connection test ${c.on?'passed':'failed, connector is off'}')">Test</button></div></div>`).join('')}</div>`},
pb(){const op=inc.filter(i=>i.status!=='Closed');return`<div class="card"><label><input type="checkbox" ${S.auto?'checked':''} onchange="S.auto=this.checked;log('Auto-isolate on critical '+(S.auto?'on':'off'));toast('Auto-isolate '+(S.auto?'on':'off'))"> Run Isolate host automatically on new critical incidents</label></div><div class="grid">${pbs.map((p,i)=>`<div class="card"><b>${p.n}</b><ol class="m">${p.st.map(s=>`<li>${s}</li>`).join('')}</ol><div class="row"><select id="pi${i}">${op.map(o=>`<option>${o.id}</option>`).join('')||'<option value="">No open incident</option>'}</select><button class="btn" onclick="runPb($('#pi${i}').value,${i})">Run</button></div></div>`).join('')}</div><div class="card"><b>Run history</b>${table(['Time','Playbook','Incident','Run by','Result'],plog.map(p=>[fmt(p.t),p.pb,p.inc,p.by,p.res]))}</div>`},
ad(){return`<div class="card"><b>Users and roles</b>${table(['User','Role','MFA','Actions'],users.map((u,i)=>[esc(u.n),sel(['Admin','Analyst','Viewer'],u.r,`users[${i}].r=this.value;log('Role of ${esc(u.n)} set to '+this.value)`),u.mfa?'Enforced':'Off',`<button class="btn s" onclick="users[${i}].mfa^=1;log('MFA toggled');render()">Toggle MFA</button> <button class="btn d" onclick="users.splice(${i},1);log('User removed');render()">Remove</button>`]))}<div class="row"><input id="un" placeholder="Username"><button class="btn" onclick="addUser()">Add user</button></div></div><div class="card"><b>Retention and reports</b><div class="row">Retention ${sel(['30 days','90 days','365 days'],'90 days',"log('Retention set to '+this.value);toast('Retention set to '+this.value)")}<button class="btn s" onclick="report()">Generate incident report</button><button class="btn d" onclick="if(confirm('Delete all stored events?')){ev=[];log('Events purged');render()}">Purge events</button></div></div><div class="card"><b>Audit log</b>${table(['Time','User','Action'],audit.slice(0,30).map(a=>[fmt(a.t),esc(a.u),esc(a.m)]))}</div>`}};
function runQ(){const qe=$('#q');if(qe)S.q=qe.value;const te=$('#tr');if(te)S.tr=+te.value;const p=parseQ(S.q),lim=S.tr?Date.now()-S.tr*36e5:0;S.res=ev.filter(e=>e.t>=lim&&match(e,p.c));const m=(p.p[0]||'').match(/^(?:count by|top)\s+(\w+)/i);let h;if(m){const c={};S.res.forEach(e=>{const k=e[m[1]]??'n/a';c[k]=(c[k]||0)+1});h=table([m[1],'count'],Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,25).map(([k,v])=>[esc(k),v]))}else h=`<div class="m">${S.res.length} events matched, showing up to 100</div>`+table(['Time','Source','Event','Sev','Host','User','IP'],S.res.slice(0,100).map(e=>[fmt(e.t),e.source,esc(e.event),tag(e.sev),e.host,e.user,`<span class="mono">${e.ip}</span>`]),'showEv',S.res.slice(0,100).map(e=>e.id));$('#res').innerHTML=h}
function saveQ(){S.q=$('#q').value;if(!saved.includes(S.q))saved.push(S.q);log('Saved query');toast('Query saved');render()}
function expQ(){const r=(S.res||[]).slice(0,1000);modal(`<b>CSV export (${r.length} rows)</b><textarea id="csv" class="mono" style="width:100%;height:260px;margin-top:8px">${esc('time,source,event,sev,host,user,ip\n'+r.map(e=>[new Date(e.t).toISOString(),e.source,e.event,e.sev,e.host,e.user,e.ip].join(',')).join('\n'))}</textarea><div class="row"><button class="btn" onclick="cp()">Copy</button><button class="btn s" onclick="mc()">Close</button></div>`)}
function cp(){const t=$('#csv');t.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Press Ctrl+C to copy')}}
function showEv(id){const e=ev.find(x=>x.id===id);if(!e)return;modal(`<b>Event ${e.id}</b><table class="mono">${Object.entries(e).map(([k,v])=>`<tr><td>${k}</td><td>${esc(k==='t'?new Date(v).toISOString():v)}</td></tr>`).join('')}</table><div class="row"><button class="btn" onclick="evInc('${id}')">Create incident</button><button class="btn s" onclick="evIoc('${id}')">Add IP to threat intel</button><button class="btn s" onclick="mc()">Close</button></div>`)}
function evInc(id){const e=ev.find(x=>x.id===id);const i=addInc(e.event+' on '+e.host,e.sev==='info'?'low':e.sev,e.host,'Manual',1);mc();S.si=i.id;go('inc')}
function evIoc(id){const e=ev.find(x=>x.id===id);if(!iocs.some(o=>o.v===e.ip))iocs.push({v:e.ip,t:'IP',s:'Analyst'});log('IOC added '+e.ip);mc();toast(e.ip+' added to threat intel')}
function openInc(id){S.si=id;S.v='inc';render();document.querySelector('main').scrollTop=1e5}
function det(){const i=inc.find(x=>x.id===S.si);if(!i)return'';const op=pbs.map((p,k)=>`<option value="${k}">${p.n}</option>`).join('');return`<div class="card"><div class="top"><h3 style="margin:0;flex:1">${i.id}: ${esc(i.title)}</h3><button class="btn s" onclick="S.si=null;render()">Close panel</button></div><div class="m">Rule: ${esc(i.rule)}. Host: ${esc(i.host)}. Events: ${i.evs}. Opened ${fmt(i.t)}</div><div class="row">Severity ${sel(SEV,i.sev,`setInc('${i.id}','sev',this.value)`)} Status ${sel(['New','Investigating','Resolved','Closed'],i.status,`setInc('${i.id}','status',this.value)`)} Owner ${sel(['Unassigned',...users.map(u=>u.n)],i.owner,`setInc('${i.id}','owner',this.value)`)}</div><div class="row"><select id="ps">${op}</select><button class="btn" onclick="runPb('${i.id}',+$('#ps').value)">Run playbook</button><button class="btn s" onclick="setInc('${i.id}','status','Closed',1)">Close incident</button></div><b>Timeline</b>${table(['Time','By','Note'],i.notes.slice().reverse().map(n=>[fmt(n.t),esc(n.a),esc(n.x)]))}<div class="row"><input id="nt" style="flex:1" placeholder="Add a note"><button class="btn" onclick="addNote('${i.id}')">Add note</button></div></div>`}
function setInc(id,f,v,r){const i=inc.find(x=>x.id===id);i[f]=v;i.notes.push({t:Date.now(),a:S.user,x:f+' set to '+v});log(id+' '+f+' set to '+v);toast(id+': '+f+' is now '+v);if(r||f==='status'||f==='sev')render()}
function addNote(id){const v=$('#nt').value.trim();if(!v)return toast('Write a note first');inc.find(x=>x.id===id).notes.push({t:Date.now(),a:S.user,x:v});log('Note added to '+id);render()}
function runPb(id,k,auto){const i=inc.find(x=>x.id===id);if(!i)return toast('Select an open incident first');const p=pbs[k];plog.unshift({t:Date.now(),pb:p.n,inc:id,by:auto?'automation':S.user,res:'Success'});i.notes.push({t:Date.now(),a:'playbook',x:p.n+': '+p.st.join(', ')});if(i.status==='New')i.status='Investigating';log('Playbook '+p.n+' ran on '+id);toast(p.n+' completed on '+id);if(!auto)render()}
function addRule(){const n=$('#rn').value.trim(),q=$('#rq').value.trim();if(!n||!q)return toast('Name and query are required');rules.push({id:Date.now(),name:n,q,thr:+$('#rt').value||1,sev:$('#rs').value,mitre:$('#rm').value||'n/a',on:1});log('Rule added: '+n);render()}
function tog(id){const r=rules.find(x=>x.id===id);r.on^=1;log('Rule '+r.name+(r.on?' enabled':' disabled'));render()}
function delRule(id){rules=rules.filter(x=>x.id!==id);log('Rule deleted');render()}
function runRule(id){const r=rules.find(x=>x.id===id),c=parseQ(r.q).c,g={};ev.filter(e=>match(e,c)).forEach(e=>g[e.host]=(g[e.host]||0)+1);let n=0;Object.entries(g).forEach(([h,k])=>{if(k>=r.thr&&!inc.some(i=>i.rule===r.name&&i.host===h&&i.status!=='Closed')){addInc(r.name+' on '+h,r.sev,h,r.name,k);n++}});toast(n+' new incident(s) from "'+r.name+'"');log('Rule run: '+r.name);render()}
function addIoc(){const v=$('#iv').value.trim();if(!v)return toast('Enter an indicator');iocs.push({v,t:$('#it').value,s:$('#is').value||'Manual'});log('IOC added '+v);render()}
function scanIoc(){let n=0;iocs.forEach(o=>{const h=ev.filter(e=>Object.values(e).join(' ').toLowerCase().includes(o.v.toLowerCase()));if(h.length&&!inc.some(i=>i.rule==='Threat intel: '+o.v&&i.status!=='Closed')){addInc('Threat intel match: '+o.v,'high',h[0].host,'Threat intel: '+o.v,h.length);n++}});toast(n?n+' incident(s) opened from IOC matches':'No new matches');render()}
function addUser(){const n=$('#un').value.trim();if(!n)return toast('Enter a username');users.push({n,r:'Analyst',mfa:1});log('User added: '+n);render()}
function report(){modal(`<b>Incident report</b><textarea id="csv" class="mono" style="width:100%;height:260px;margin-top:8px">${esc('id,title,severity,status,owner,opened\n'+inc.map(i=>[i.id,i.title,i.sev,i.status,i.owner,new Date(i.t).toISOString()].join(',')).join('\n'))}</textarea><div class="row"><button class="btn" onclick="cp()">Copy</button><button class="btn s" onclick="mc()">Close</button></div>`)}
(function seed(){const now=Date.now();for(let i=0;i<500;i++){const e=mk(now-rn(864e5));if(e)ev.push(e)}ev.sort((a,b)=>b.t-a.t);const o=[['Brute force: repeated failed logons on dc01','high','dc01','Brute force: repeated failed logons',9],['Encoded PowerShell execution on laptop-hr-14','high','laptop-hr-14','Encoded PowerShell execution',2],['Mailbox forwarding rule created on web-prod-02','medium','web-prod-02','Mailbox forwarding rule created',1]];o.forEach(x=>addInc(...x));audit.length=0;log('Session started');toast=(t=>m=>t(m))(toast);rules.forEach(r=>r);render();setInterval(tick,1500)})();
</script><script src="/api-layer.js"></script></body></html>
